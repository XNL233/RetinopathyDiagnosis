<!doctype html>
<html lang="zh-CN">
  <!-- 定义页面的元信息 -->
  <head>
    <!-- 定义页面的字符编码为 UTF-8 -->
    <meta charset="UTF-8" />
    <!-- 定义页面的图标，图标格式是 SVG，图标文件的路径是 /vite.svg -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- 定义页面的视口（viewport），用于响应式设计 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 定义页面的标题，显示在浏览器标签页和收藏夹 -->
    <title>视网膜病变AI诊断平台</title>
  </head>
  <body>
    <!-- 定义页面的主体内容，Vue 应用将挂载到这个 div 元素上 -->
    <div id="app"></div>
    <!-- 引入 Vue 应用的主 JavaScript 文件，使用 ES 模块加载 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
